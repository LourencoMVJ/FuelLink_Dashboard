<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Credenciais | FuelLink & Bankers Tankers</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Blank Favicon until official logo is added -->
  <link rel="icon" href="data:,">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <main class="login-page">

    <!-- Fullscreen Photographic Background -->
    <div class="fullscreen-bg" aria-hidden="true"></div>
    <div class="fullscreen-overlay" aria-hidden="true"></div>

    <!-- Top Right Floating Modern Language Switcher -->
    <div class="login-screen-top-bar" aria-label="Idioma / Language">
      <div id="requestLangToggle" class="pill-toggle-group login-top-toggle" role="group" aria-label="Idioma / Language"></div>
    </div>

    <!-- LEFT SECTION: Platform Information -->
    <section class="info-section" aria-label="Informações da Plataforma">
      <div class="info-content">
        <h1 class="info-title" id="lblInfoTitle">
          Gestão Integrada de <span class="accent-fl">Combustível</span> & <span class="accent-bt">Logística</span>
        </h1>
        <p class="info-subtitle" id="lblInfoSubtitle">
          Painel centralizado de operações, reconciliação de viagens e controlo financeiro em tempo real.
        </p>
      </div>
    </section>

    <!-- RIGHT SECTION: Floating Liquid Glass Form Card -->
    <section class="form-section" aria-label="Recuperação de Acesso">
      <div class="form-container">

        <!-- Header -->
        <header class="form-header centered">
          <span class="welcome-label" id="lblRecoveryBadge">Apoio ao Utilizador</span>
          <h2 class="form-title" id="lblForgotTitle">Recuperar Acesso</h2>
          <p class="form-subtitle" id="lblForgotSubtitle">Introduza o seu email institucional para iniciar o processo.</p>
        </header>

        <!-- Feedback Alert Banner -->
        <div id="requestAlert" class="pill-alert-box" role="alert" aria-live="polite" style="display: none;">
          <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="requestAlertMsg"></span>
        </div>

        <!-- Request Access Form -->
        <form id="requestAccessForm" class="login-form" autocomplete="on" novalidate>

          <!-- Email Input (Pill) -->
          <div class="input-pill-wrapper">
            <span class="input-pill-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="requestEmailInput" class="pill-input" placeholder="Email institucional"
              autocomplete="email" required />
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btnSubmitRequest" class="pill-submit-btn">
            <span class="pill-spinner"></span>
            <span class="btn-text" id="btnSubmitRequestText">Submeter Pedido</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Back to Login Link -->
        <footer class="form-card-footer">
          <p class="support-text">
            <a href="login.html" class="pill-forgot-link" id="lblBackToLogin" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span id="lblBackToLoginText">Voltar ao Início de Sessão</span>
            </a>
          </p>
        </footer>

      </div>
    </section>

  </main>

  <script type="module" src="../assets/js/views/request-access.js"></script>
</body>

</html>
